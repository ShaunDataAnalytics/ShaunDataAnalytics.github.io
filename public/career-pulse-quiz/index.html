<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Time Personality Type Quiz — how you spend attention under job-search pressure and your 80/20 breakthrough path." />
  <title>Time Personality Type Quiz</title>
  
  <link rel="stylesheet" href="css/pico.min.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>

  <main class="quiz-container" id="quiz-app">
    <noscript>
      <div class="quiz-card" style="text-align: center; padding: 2rem;">
        <h2>JavaScript required</h2>
        <p>Enable JavaScript to take the quiz and generate your share poster.</p>
      </div>
    </noscript>
  </main>

  <div id="poster-modal" class="poster-modal-overlay" role="dialog" aria-modal="true">
    <div class="poster-modal-content">
      <div class="poster-modal-header">
        <h3 class="poster-modal-title">🎉 Your share poster</h3>
        <button id="poster-close-btn" class="poster-close-btn" aria-label="Close">&times;</button>
      </div>

      <div class="poster-image-container">
        <img id="poster-preview-img" class="poster-preview-img" alt="Quiz result poster preview" />
      </div>

      <div class="poster-save-tip">
        <span>📱 On mobile, long-press the image to save to your camera roll</span>
      </div>

      <div class="poster-btn-group">
        <button id="btn-download-poster" class="btn-primary" style="width: 100%;">
          💾 Download poster
        </button>

        <button id="btn-share-poster" class="btn-secondary" style="width: 100%; display: none;">
          📤 Share
        </button>

        <button id="btn-copy-invite" class="btn-secondary" style="width: 100%;">
          📋 Copy invite link & text
        </button>
      </div>

      <div id="manual-copy-box" class="manual-copy-box">
        <label for="manual-copy-textarea" style="font-size: 0.8rem; color: #64748b;">Select and copy the text below:</label>
        <textarea id="manual-copy-textarea" readonly></textarea>
      </div>
    </div>
  </div>

  <div id="qr-offscreen-target" class="offscreen-container"></div>

  <div id="quiz-toast" class="toast-notice"></div>

  <script src="js/qrcode.min.js"></script>
  <script src="js/quiz-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
