<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="精选真实求职情境：测测你的隐性内耗卡点与专属 80/20 破局出路" />
  <title>求职内耗型格测评</title>
  
  <!-- 本地固定版本样式（零外部 CDN 依赖） -->
  <link rel="stylesheet" href="css/pico.min.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>

  <!-- 主交互容器：由 js/app.js 驱动动态渲染 -->
  <main class="quiz-container" id="quiz-app">
    <noscript>
      <div class="quiz-card" style="text-align: center; padding: 2rem;">
        <h2>请开启 JavaScript</h2>
        <p>本测评页面需要启用 JavaScript 以提供流畅的答题与海报生成体验。</p>
      </div>
    </noscript>
  </main>

  <!-- 海报生成展示模态窗 -->
  <div id="poster-modal" class="poster-modal-overlay" role="dialog" aria-modal="true">
    <div class="poster-modal-content">
      <div class="poster-modal-header">
        <h3 class="poster-modal-title">🎉 你的专属分享海报</h3>
        <button id="poster-close-btn" class="poster-close-btn" aria-label="关闭">&times;</button>
      </div>

      <div class="poster-image-container">
        <img id="poster-preview-img" class="poster-preview-img" alt="测评结果海报预览" />
      </div>

      <div class="poster-save-tip">
        <span>📱 手机用户可长按上方图片直接保存到相册</span>
      </div>

      <div class="poster-btn-group">
        <button id="btn-download-poster" class="btn-primary" style="width: 100%;">
          💾 下载海报图片
        </button>

        <button id="btn-share-poster" class="btn-secondary" style="width: 100%; display: none;">
          📤 调用系统分享
        </button>

        <button id="btn-copy-invite" class="btn-secondary" style="width: 100%;">
          📋 复制邀请文案与测试链接
        </button>
      </div>

      <!-- 剪贴板受限时的降级手动复制区域 -->
      <div id="manual-copy-box" class="manual-copy-box">
        <label for="manual-copy-textarea" style="font-size: 0.8rem; color: #64748b;">长按或选中下方文本复制：</label>
        <textarea id="manual-copy-textarea" readonly></textarea>
      </div>
    </div>
  </div>

  <!-- 离屏工作区：用于 QRCode.js 静默渲染二维码，不影响前台视觉 -->
  <div id="qr-offscreen-target" class="offscreen-container"></div>

  <!-- 全局轻提示 Toast -->
  <div id="quiz-toast" class="toast-notice"></div>

  <!-- 本地固定版本依赖脚本（零外部 CDN 依赖） -->
  <script src="js/qrcode.min.js"></script>
  <script src="js/quiz-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
